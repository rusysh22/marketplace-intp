<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Compassion Market</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
</head>
<body>
  <header id="topnav" class="topnav"></header>
  <div class="wrap admin-layout">
    <aside class="admin-side" id="admin-side" aria-label="Menu admin">
      <span class="grp">Operasional</span>
      <button type="button" data-sec="dashboard">Dashboard</button>
      <button type="button" data-sec="review">Verifikasi barang <span class="pill" data-count="review" hidden></span></button>
      <button type="button" data-sec="orders">Pesanan <span class="pill" data-count="orders" hidden></span></button>
      <button type="button" data-sec="products">Produk & stok</button>
      <button type="button" data-sec="flash">Flash sale</button>
      <button type="button" data-sec="payout">Pencairan penjual</button>
      <span class="grp">Master data</span>
      <button type="button" data-sec="categories">Jenis barang</button>
      <button type="button" data-sec="payments">Metode pembayaran</button>
      <button type="button" data-sec="settings">Pengaturan</button>
      <button type="button" data-sec="users">Pengguna</button>
      <button type="button" data-sec="audit">Audit log</button>
    </aside>
    <main class="admin-main" id="admin-main"><div class="loading-block"><span class="spinner"></span></div></main>
  </div>
  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
