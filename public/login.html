<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pilih identitas — Compassion Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
</head>
<body>
  <header id="topnav" class="topnav"></header>
  <main class="wrap" style="max-width:520px;padding:28px 0 60px">
    <div id="pane-identity">
      <div class="page-head"><span class="kicker">Karyawan</span><h1>Anda siapa?</h1>
        <p>Ketik <strong>email kantor Interport</strong> Anda lengkap, lalu tekan Enter. Tidak perlu password —
          barang tetap diverifikasi admin sebelum tayang.</p></div>
      <form class="panel" id="form-identity">
        <label class="field"><span class="req">Email kantor</span>
          <input type="email" id="q" placeholder="nama.anda@interport.co.id" autocomplete="email" required inputmode="email" autocapitalize="off" autocorrect="off">
          <small>Gunakan email @interport.co.id, ketik lengkap lalu tekan Enter</small></label>
        <button class="btn btn-primary btn-block" type="submit" style="margin-top:4px">Cari & konfirmasi identitas</button>
        <div id="emp-result" style="margin-top:12px"></div>
      </form>
      <button class="btn btn-ghost btn-sm" type="button" id="show-admin" style="margin-top:14px">Saya admin, masuk dengan password</button>
    </div>

    <div id="pane-admin" class="hidden">
      <div class="page-head"><span class="kicker">Admin marketplace</span><h1>Masuk admin</h1>
        <p>Khusus admin. Akun dibuat lewat Supabase Dashboard, bukan di halaman ini.</p></div>
      <form class="panel" id="form-admin" autocomplete="on">
        <div style="display:grid;gap:12px">
          <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
          <label class="field"><span>Password</span><input type="password" name="password" required autocomplete="current-password"></label>
          <button class="btn btn-primary btn-block" type="submit">Masuk</button>
          <button class="btn btn-ghost btn-sm" type="button" id="forgot">Lupa password?</button>
        </div>
      </form>
      <button class="btn btn-ghost btn-sm" type="button" id="show-identity" style="margin-top:14px">← Kembali pilih identitas</button>
    </div>
  </main>
  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
